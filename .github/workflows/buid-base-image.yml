name: build-base-image

on:
  push:
    path:
      - 'dev-sec-ops/base-images/**'

jobs:
  build-license-finder-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build base image
        run: docker build -t ${{ secrets.DOCKER_REGISTRY_USER }}/license-finder:latest -f dev-sec-ops/base-images/license-finder.dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PAT }}

      - name: Push the Docker image
        run: docker push ${{ secrets.DOCKER_REGISTRY_USER }}/license-finder:latest

  build-gitleaks-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build base image
        run: docker build -t ${{ secrets.DOCKER_REGISTRY_USER }}/gitleaks:latest -f dev-sec-ops/base-images/gitleaks.dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PAT }}

      - name: Push the Docker image
        run: docker push ${{ secrets.DOCKER_REGISTRY_USER }}/gitleaks:latest

  build-openjdk-slim-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build base image
        run: docker build -t ${{ secrets.DOCKER_REGISTRY_USER }}/openjdk-slim:latest -f dev-sec-ops/base-images/openjdk-slim.dockerfile .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PAT }}

      - name: Push the Docker image
        run: docker push ${{ secrets.DOCKER_REGISTRY_USER }}/openjdk-slim:latest